<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rkuklinski.pl — Under Construction</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #111;
    }
    .stripe {
      position: fixed;
      left: 0;
      right: 0;
      height: 20px;
      background: repeating-linear-gradient(-45deg, #f5c400 0 20px, #111 20px 40px);
    }
    .top { top: 0; }
    .bottom { bottom: 0; }
    .icon { font-size: 4rem; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { margin: 0; font-size: 1.2rem; opacity: .75; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #f2f2f2; }
    }
  </style>
</head>
<body>
  <div class="stripe top"></div>
  <div class="icon" aria-hidden="true">🚧</div>
  <h1>Under Construction</h1>
  <p>rkuklinski.pl is being built. Please check back soon.</p>
  <div class="stripe bottom"></div>
</body>
</html>
